services:
  db:
    image: postgres:15-alpine
    container_name: timix-db-prod
    environment:
      POSTGRES_USER: timixuser
      POSTGRES_PASSWORD: timixpassword
      POSTGRES_DB: timixdb
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timixuser -d timixdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timix-app-prod
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://timixuser:timixpassword@db:5432/timixdb
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: timix-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  postgres_data_prod:
